name: Java CI/CD & Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Package with Maven
      run: |
        mvn -B clean package -DskipTests

    - name: Upload Build WAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoodApp-WAR
        path: FoodApp/target/*.war
